# Exchange data source: binance | bybit | gate
# Note: public market data needs no API key.
EXCHANGE: binance
SYMBOL: BTCUSDT
INTERVAL: 1d            # 15m | 30m | 1h | 4h | 1d  (4h churns: fee drag + whipsaws; 1d is this strategy's home ground)

STRATEGY:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_overbought: 70    # don't open long above this
  rsi_oversold: 30      # don't open short below this
  atr_period: 14
  atr_stop_mult: 2.0    # trailing stop = 2 x ATR

RISK:
  fee_rate: 0.0005      # 0.05% per side
  position_size: 1.0    # fraction of equity per trade

AGENT:
  poll_seconds: 60      # live loop polling interval
  state_file: state/agent_state.json
  log_file: logs/agent.log
